# Replace the hostname, certificate paths, and C:/GenericReporting paths before use.
# This template expects php-cgi.exe to be supervised on 127.0.0.1:9000.

server {
    listen 80;
    server_name reports.example.internal;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name reports.example.internal;

    ssl_certificate     C:/nginx/certs/reports.example.internal.crt;
    ssl_certificate_key C:/nginx/certs/reports.example.internal.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root C:/GenericReporting/Frontend/Generic-Reporting-Framework/dist;
    index index.html;
    client_max_body_size 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /api {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME C:/GenericReporting/Backend/api/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT C:/GenericReporting/Backend/api;
        fastcgi_param HTTPS on;
        fastcgi_param GENERIC_APP_ENV production;
    }

    location = /api/index.php {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME C:/GenericReporting/Backend/api/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT C:/GenericReporting/Backend/api;
        fastcgi_param HTTPS on;
        fastcgi_param GENERIC_APP_ENV production;
    }

    # No other backend path is web-routable. These rules provide defense in depth.
    location ^~ /api/ { return 404; }
    location ~* (^|/)(\.env|\.git|config|app|core|tests|logs|storage|backups?)(/|$) { deny all; }
    location ~* \.(?:json|lock|sql|bak|backup|ini|log|php)$ { deny all; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
