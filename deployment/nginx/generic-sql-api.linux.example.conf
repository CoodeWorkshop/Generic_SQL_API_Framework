# Phase 4.2 HTTP routing template. Add transport security separately in Phase 4.3.
# Replace paths, names, and the PHP-FPM socket for the target distribution.

upstream generic_sql_api_php {
    server unix:/run/php/php-fpm.sock;
}

# Public reporting frontend and fixed API entry point.
server {
    listen 80;
    server_name reports.example.internal;
    root /srv/generic-reporting/Frontend/Generic-Reporting-Framework/dist;
    index index.html;
    client_max_body_size 10m;

    location = /api {
        include fastcgi_params;
        fastcgi_pass generic_sql_api_php;
        fastcgi_param SCRIPT_FILENAME /srv/generic-reporting/Backend/api/index.php;
        fastcgi_param SCRIPT_NAME /api;
        fastcgi_param GENERIC_APP_ENV production;
    }

    location = /api/index.php {
        include fastcgi_params;
        fastcgi_pass generic_sql_api_php;
        fastcgi_param SCRIPT_FILENAME /srv/generic-reporting/Backend/api/index.php;
        fastcgi_param SCRIPT_NAME /api/index.php;
        fastcgi_param GENERIC_APP_ENV production;
    }

    location ^~ /api/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
    location ~ /\. { deny all; }
}

# Loopback-only Admin Console. /api.php is intentionally on this separate origin.
server {
    listen 127.0.0.1:8090;
    listen [::1]:8090;
    server_name localhost;
    root /srv/generic-reporting/Backend/admin;
    client_max_body_size 10m;

    allow 127.0.0.1;
    allow ::1;
    deny all;

    location = / { return 302 /admin; }
    location = /api.php {
        include fastcgi_params;
        fastcgi_pass generic_sql_api_php;
        fastcgi_param SCRIPT_FILENAME /srv/generic-reporting/Backend/admin/api.php;
        fastcgi_param SCRIPT_NAME /api.php;
        fastcgi_param GENERIC_APP_ENV production;
        fastcgi_param GENERIC_ADMIN_ENABLED 1;
    }
    location = /admin {
        include fastcgi_params;
        fastcgi_pass generic_sql_api_php;
        fastcgi_param SCRIPT_FILENAME /srv/generic-reporting/Backend/admin/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param GENERIC_APP_ENV production;
        fastcgi_param GENERIC_ADMIN_ENABLED 1;
    }
    location ^~ /admin/ {
        include fastcgi_params;
        fastcgi_pass generic_sql_api_php;
        fastcgi_param SCRIPT_FILENAME /srv/generic-reporting/Backend/admin/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param GENERIC_APP_ENV production;
        fastcgi_param GENERIC_ADMIN_ENABLED 1;
    }
    location = /assets/admin.css { try_files $uri =404; }
    location = /assets/admin.js { try_files $uri =404; }
    location = /assets/service-controls.css { try_files $uri =404; }
    location / { return 404; }
}

# Independently routable SQL Parser. Keep loopback-only unless policy requires otherwise.
server {
    listen 127.0.0.1:8101;
    listen [::1]:8101;
    server_name localhost;
    root /srv/generic-reporting/Backend/sqlparser;
    client_max_body_size 10m;

    allow 127.0.0.1;
    allow ::1;
    deny all;

    location = / {
        include fastcgi_params;
        fastcgi_pass generic_sql_api_php;
        fastcgi_param SCRIPT_FILENAME /srv/generic-reporting/Backend/sqlparser/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param GENERIC_APP_ENV production;
    }
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass generic_sql_api_php;
        fastcgi_param SCRIPT_FILENAME /srv/generic-reporting/Backend/sqlparser/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param GENERIC_APP_ENV production;
    }
    location = /assets/css/app.css { try_files $uri =404; }
    location = /assets/js/app.js { try_files $uri =404; }
    location / { return 404; }
}
