; Merge these settings into the php.ini used by the supervised php-cgi.exe process.
; Keep required ODBC/OpenSSL extension settings from the installed PHP configuration.

display_errors = Off
display_startup_errors = Off
log_errors = On
expose_php = Off
error_reporting = E_ALL

session.use_cookies = 1
session.use_only_cookies = 1
session.use_strict_mode = 1
session.use_trans_sid = 0
session.cookie_secure = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.cookie_lifetime = 0
session.gc_maxlifetime = 28800

; Authentication payloads are small. Nginx enforces the broader application limit.
post_max_size = 10M
upload_max_filesize = 10M
